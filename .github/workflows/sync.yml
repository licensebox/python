name: Sync SDK contract
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    if: github.repository_owner == 'licensebox'
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.discover.outputs.ref }}
      changed: ${{ steps.discover.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/discover.py
  test:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    uses: licensebox/protocol/.github/workflows/sdk.yml@1bfdfb756c07323a74fa5b5a68c447a1fdb17be0
    with:
      language: python
      protocol_ref: ${{ needs.discover.outputs.ref }}
  propose:
    needs: [discover, test]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-protocol-pin
          path: .
      - name: Open tested metadata PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/open_sync_pr.py
