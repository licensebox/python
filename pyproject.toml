[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "licensebox"
version = "0.1.0"
description = "Machine-bound Licensebox licensing for desktop and command-line apps"
requires-python = ">=3.10"
dependencies = ["cryptography>=43"]
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Vijai Kumar"}]

[project.urls]
Homepage = "https://licensebox.dev"
Repository = "https://github.com/licensebox/python"

[tool.setuptools.packages.find]
where = ["src"]
